<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>치과 검색 + 지도 서비스</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 15px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background: #5a67d8;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .content-wrapper {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .results-panel {
            flex: 1;
            max-width: 400px;
        }

        .map-panel {
            flex: 1;
            min-height: 500px;
        }

        #map {
            width: 100%;
            height: 500px;
            border-radius: 10px;
            border: 2px solid #ddd;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .dentist-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .dentist-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            background: #e8f4f8;
        }

        .dentist-card.selected {
            background: #d4edda;
            border-color: #28a745;
        }

        .dentist-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .dentist-info {
            color: #666;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .distance-info {
            background: #007bff;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            display: inline-block;
            margin-top: 5px;
        }

        .map-buttons {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        .map-btn {
            padding: 8px 15px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .map-btn:hover {
            background: #218838;
        }

        .error {
            background: #ffebee;
            border: 1px solid #ffcdd2;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .info-window {
            max-width: 200px;
            padding: 10px;
        }

        .info-window h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .info-window p {
            font-size: 12px;
            color: #666;
            margin-bottom: 3px;
        }

        @media (max-width: 768px) {
            .content-wrapper {
                flex-direction: column;
            }

            .results-panel {
                max-width: none;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🦷 치과 검색 + 지도 서비스</h1>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="지역명을 입력하세요 (예: 동대문구, 강남구)" />
            <button id="searchBtn">검색</button>
        </div>

        <div id="loadingDiv" class="loading" style="display: none;">
            🔍 치과를 검색 중입니다...
        </div>

        <div id="errorDiv" class="error" style="display: none;"></div>

        <div class="content-wrapper">
            <div class="results-panel">
                <div id="resultsDiv"></div>
            </div>

            <div class="map-panel">
                <div class="map-buttons">
                    <button class="map-btn" id="showAllBtn">전체 보기</button>
                    <button class="map-btn" id="myLocationBtn">내 위치</button>
                </div>
                <div id="map"></div>
            </div>
        </div>
    </div>

    <!-- 수정된 네이버 지도 API 로드 -->
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=xeekdlh89k"></script>

    <script>
        let map;
        let markers = [];
        let infoWindows = [];
        let currentDentists = [];

        // 페이지 로드 시 지도 초기화
        window.addEventListener('load', function () {
            initMap();
        });

        function initMap() {
            // 서울 중심으로 지도 초기화
            const mapOptions = {
                center: new naver.maps.LatLng(37.5665, 126.9780), // 서울 시청
                zoom: 11,
                mapTypeControl: true
            };

            map = new naver.maps.Map('map', mapOptions);

            // 지도 버튼 이벤트
            document.getElementById('showAllBtn').addEventListener('click', showAllMarkers);
            document.getElementById('myLocationBtn').addEventListener('click', showMyLocation);
        }

        // 검색 관련 변수들
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const loadingDiv = document.getElementById('loadingDiv');
        const errorDiv = document.getElementById('errorDiv');
        const resultsDiv = document.getElementById('resultsDiv');

        // 검색 이벤트 등록
        searchBtn.addEventListener('click', searchDentists);
        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchDentists();
            }
        });

        async function searchDentists() {
            const query = searchInput.value.trim();

            if (!query) {
                alert('검색할 지역명을 입력해주세요!');
                return;
            }

            // UI 상태 초기화
            loadingDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            resultsDiv.innerHTML = '';
            searchBtn.disabled = true;

            // 기존 마커 제거
            clearMarkers();

            try {
                const response = await fetch(`/api/search-dentists?query=${encodeURIComponent(query)}&display=15`);
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error);
                }

                currentDentists = data.items;
                displayResults(data.items, data.total);
                displayMarkersOnMap(data.items);

            } catch (error) {
                console.error('검색 오류:', error);
                errorDiv.textContent = '검색 중 오류가 발생했습니다: ' + error.message;
                errorDiv.style.display = 'block';
            } finally {
                loadingDiv.style.display = 'none';
                searchBtn.disabled = false;
            }
        }

        function displayResults(dentists, total) {
            if (dentists.length === 0) {
                resultsDiv.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #666;">
                        😔 검색 결과가 없습니다.<br>
                        다른 지역명으로 검색해보세요.
                    </div>
                `;
                return;
            }

            resultsDiv.innerHTML = `
                <h3 style="margin-bottom: 20px;">💡 ${total}개의 치과 발견 (상위 ${dentists.length}개 표시)</h3>
                ${dentists.map((dentist, index) => `
                    <div class="dentist-card" data-index="${index}" onclick="focusMarker(${index})">
                        <div class="dentist-name">${index + 1}. ${dentist.name}</div>
                        <div class="dentist-info">📍 주소: ${dentist.address}</div>
                        <div class="dentist-info">🛣️ 도로명: ${dentist.roadAddress || '도로명 주소 없음'}</div>
                        <div class="dentist-info">📞 전화: ${dentist.telephone || '⚠️ 전화번호 정보 없음'}</div>
                        <div class="dentist-info">🏷️ 분류: ${dentist.category}</div>
                        <div class="distance-info" id="distance-${index}">📍 지도에서 위치 확인</div>
                    </div>
                `).join('')}
                <div style="margin-top: 20px; padding: 15px; background: #fff3cd; border-radius: 8px; font-size: 14px;">
                    💡 <strong>사용법:</strong><br>
                    • 치과 카드를 클릭하면 지도에서 해당 위치로 이동합니다<br>
                    • 마커를 클릭하면 상세 정보가 표시됩니다<br>
                    • "전체 보기"로 모든 치과를 한눈에 볼 수 있습니다
                </div>
            `;
        }

        function displayMarkersOnMap(dentists) {
            clearMarkers();

            dentists.forEach((dentist, index) => {
                // 좌표 변환 (네이버 API 응답 좌표를 실제 좌표로 변환)
                const lng = dentist.mapx / 10000000;
                const lat = dentist.mapy / 10000000;

                if (lng && lat) {
                    // 마커 생성
                    const marker = new naver.maps.Marker({
                        position: new naver.maps.LatLng(lat, lng),
                        map: map,
                        title: dentist.name,
                        icon: {
                            content: `
                                <div style="
                                    background: #007bff; 
                                    color: white; 
                                    padding: 5px 8px; 
                                    border-radius: 15px; 
                                    font-size: 12px; 
                                    font-weight: bold;
                                    border: 2px solid white;
                                    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
                                ">${index + 1}</div>
                            `,
                            size: new naver.maps.Size(30, 30),
                            anchor: new naver.maps.Point(15, 15)
                        }
                    });

                    // 정보창 생성
                    const infoWindow = new naver.maps.InfoWindow({
                        content: `
                            <div class="info-window">
                                <h4>${dentist.name}</h4>
                                <p>📍 ${dentist.address}</p>
                                <p>🛣️ ${dentist.roadAddress || '도로명 주소 없음'}</p>
                                <p>📞 ${dentist.telephone || '전화번호 없음'}</p>
                                <p>🏷️ ${dentist.category}</p>
                                <hr style="margin: 8px 0;">
                                <p style="color: #007bff; cursor: pointer;" 
                                   onclick="openNaverMap(${lat}, ${lng}, \`${dentist.name}\`)">
                                   🗺️ 네이버지도에서 보기
                                </p>
                            </div>
                        `,
                        borderWidth: 1,
                        borderColor: '#ccc',
                        backgroundColor: '#fff'
                    });

                    // 마커 클릭 이벤트
                    naver.maps.Event.addListener(marker, 'click', function () {
                        // 다른 정보창 닫기
                        infoWindows.forEach(iw => iw.close());

                        // 현재 정보창 열기
                        infoWindow.open(map, marker);

                        // 해당 카드 하이라이트
                        document.querySelectorAll('.dentist-card').forEach(card => {
                            card.classList.remove('selected');
                        });
                        document.querySelector(`[data-index="${index}"]`).classList.add('selected');
                    });

                    markers.push(marker);
                    infoWindows.push(infoWindow);
                }
            });

            // 모든 마커가 보이도록 지도 범위 조정
            if (markers.length > 0) {
                const bounds = new naver.maps.LatLngBounds();
                markers.forEach(marker => {
                    bounds.extend(marker.getPosition());
                });
                map.fitBounds(bounds, { padding: 50 });
            }
        }

        function clearMarkers() {
            markers.forEach(marker => marker.setMap(null));
            infoWindows.forEach(infoWindow => infoWindow.close());
            markers = [];
            infoWindows = [];
        }

        function focusMarker(index) {
            if (markers[index]) {
                // 해당 마커로 지도 중심 이동
                map.setCenter(markers[index].getPosition());
                map.setZoom(16);

                // 정보창 열기
                infoWindows.forEach(iw => iw.close());
                infoWindows[index].open(map, markers[index]);

                // 카드 하이라이트
                document.querySelectorAll('.dentist-card').forEach(card => {
                    card.classList.remove('selected');
                });
                document.querySelector(`[data-index="${index}"]`).classList.add('selected');
            }
        }

        function showAllMarkers() {
            if (markers.length > 0) {
                const bounds = new naver.maps.LatLngBounds();
                markers.forEach(marker => {
                    bounds.extend(marker.getPosition());
                });
                map.fitBounds(bounds, { padding: 50 });
            }
        }

        function showMyLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function (position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const myLocation = new naver.maps.LatLng(lat, lng);

                    map.setCenter(myLocation);
                    map.setZoom(15);

                    // 내 위치 마커 표시
                    new naver.maps.Marker({
                        position: myLocation,
                        map: map,
                        icon: {
                            content: '📍',
                            size: new naver.maps.Size(30, 30),
                            anchor: new naver.maps.Point(15, 15)
                        },
                        title: '내 위치'
                    });
                }, function () {
                    alert('위치 정보를 가져올 수 없습니다.');
                });
            } else {
                alert('이 브라우저는 위치 서비스를 지원하지 않습니다.');
            }
        }

        // 네이버 지도에서 보기 함수
        function openNaverMap(lat, lng, name) {
            const naverMapUrl = `https://map.naver.com/v5/search/${encodeURIComponent(name)}/place?c=${lng},${lat},15,0,0,0,dh`;
            window.open(naverMapUrl, '_blank');
        }
    </script>
</body>

</html>
