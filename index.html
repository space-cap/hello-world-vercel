<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>치과 검색 + 지도 서비스</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 15px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background: #5a67d8;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .content-wrapper {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .results-panel {
            flex: 1;
            max-width: 400px;
        }

        .map-panel {
            flex: 1;
            min-height: 500px;
        }

        #map {
            width: 100%;
            height: 500px;
            border-radius: 10px;
            border: 2px solid #ddd;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .dentist-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .dentist-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            background: #e8f4f8;
        }

        .dentist-card.selected {
            background: #d4edda;
            border-color: #28a745;
        }

        .dentist-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .dentist-info {
            color: #666;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .distance-info {
            background: #007bff;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            display: inline-block;
            margin-top: 5px;
        }

        .map-buttons {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        .map-btn {
            padding: 8px 15px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .map-btn:hover {
            background: #218838;
        }

        .error {
            background: #ffebee;
            border: 1px solid #ffcdd2;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .info-window {
            max-width: 200px;
            padding: 10px;
        }

        .info-window h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .info-window p {
            font-size: 12px;
            color: #666;
            margin-bottom: 3px;
        }

        @media (max-width: 768px) {
            .content-wrapper {
                flex-direction: column;
            }

            .results-panel {
                max-width: none;
            }
        }

        /* 기존 스타일에 추가 */
        .dentist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .radius-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .radius-btn:hover {
            background: #218838;
            transform: scale(1.05);
        }

        .radius-btn:active {
            transform: scale(0.95);
        }

        .competition-info {
            background: #e8f5e8;
            border: 1px solid #28a745;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .competition-title {
            color: #28a745;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .competitor-card {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
        }

        .distance-badge {
            background: #17a2b8;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🦷 치과 검색 + 지도 서비스</h1>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="지역명을 입력하세요 (예: 동대문구, 강남구)" />
            <button id="searchBtn">검색</button>
        </div>

        <div id="loadingDiv" class="loading" style="display: none;">
            🔍 치과를 검색 중입니다...
        </div>

        <div id="errorDiv" class="error" style="display: none;"></div>

        <div class="content-wrapper">
            <div class="results-panel">
                <div id="resultsDiv"></div>
            </div>

            <div class="map-panel">
                <div class="map-buttons">
                    <button class="map-btn" id="showAllBtn">전체 보기</button>
                    <button class="map-btn" id="myLocationBtn">내 위치</button>
                </div>
                <div id="map"></div>
            </div>
        </div>
    </div>

    <!-- 수정된 네이버 지도 API 로드 -->
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=xeekdlh89k"></script>

    <script>
        let map;
        let markers = [];
        let infoWindows = [];
        let currentDentists = [];

        // 페이지 로드 시 지도 초기화
        window.addEventListener('load', function () {
            initMap();
        });

        function initMap() {
            // 서울 중심으로 지도 초기화
            const mapOptions = {
                center: new naver.maps.LatLng(37.5665, 126.9780), // 서울 시청
                zoom: 11,
                mapTypeControl: true
            };

            map = new naver.maps.Map('map', mapOptions);

            // 지도 버튼 이벤트
            document.getElementById('showAllBtn').addEventListener('click', showAllMarkers);
            document.getElementById('myLocationBtn').addEventListener('click', showMyLocation);
        }

        // 검색 관련 변수들
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const loadingDiv = document.getElementById('loadingDiv');
        const errorDiv = document.getElementById('errorDiv');
        const resultsDiv = document.getElementById('resultsDiv');

        // 검색 이벤트 등록
        searchBtn.addEventListener('click', searchDentists);
        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchDentists();
            }
        });

        async function searchDentists() {
            const query = searchInput.value.trim();

            if (!query) {
                alert('검색할 지역명을 입력해주세요!');
                return;
            }

            // UI 상태 초기화
            loadingDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            resultsDiv.innerHTML = '';
            searchBtn.disabled = true;

            // 기존 마커 제거
            clearMarkers();

            try {
                const response = await fetch(`/api/search-dentists?query=${encodeURIComponent(query)}&display=15`);
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error);
                }

                currentDentists = data.items;
                displayResults(data.items, data.total);
                displayMarkersOnMap(data.items);

            } catch (error) {
                console.error('검색 오류:', error);
                errorDiv.textContent = '검색 중 오류가 발생했습니다: ' + error.message;
                errorDiv.style.display = 'block';
            } finally {
                loadingDiv.style.display = 'none';
                searchBtn.disabled = false;
            }
        }

        function displayResults(dentists, total) {
            if (dentists.length === 0) {
                resultsDiv.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #666;">
                        😔 검색 결과가 없습니다.<br>
                        다른 지역명으로 검색해보세요.
                    </div>
                `;
                return;
            }

            resultsDiv.innerHTML = `
                <h3 style="margin-bottom: 20px;">💡 ${total}개의 치과 발견 (상위 ${dentists.length}개 표시)</h3>
                ${dentists.map((dentist, index) => {
                const lat = dentist.mapy / 10000000;
                const lng = dentist.mapx / 10000000;

                return `
                <div class="dentist-card" data-index="${index}" onclick="focusMarker(${index})">
                    <div class="dentist-header">
                        <div class="dentist-name">${index + 1}. ${dentist.name}</div>
                        <button class="radius-btn" onclick="event.stopPropagation(); searchNearby(${lat}, ${lng}, '${dentist.name.replace(/'/g, '\\\'')}', '${dentist.address}')">
                            📍 1km
                        </button>
                    </div>
                    <div class="dentist-info">📍 주소: ${dentist.address}</div>
                    <div class="dentist-info">🛣️ 도로명: ${dentist.roadAddress || '도로명 주소 없음'}</div>
                    <div class="dentist-info">📞 전화: ${dentist.telephone || '⚠️ 전화번호 정보 없음'}</div>
                    <div class="dentist-info">🏷️ 분류: ${dentist.category}</div>
                </div>
            `;
            }).join('')}
                <div style="margin-top: 20px; padding: 15px; background: #fff3cd; border-radius: 8px; font-size: 14px;">
                    💡 <strong>사용법:</strong><br>
                    • 치과 카드를 클릭하면 지도에서 해당 위치로 이동합니다<br>
                    • <strong>"📍 1km" 버튼</strong>을 클릭하면 해당 치과 주변 1km 내 경쟁업체를 확인할 수 있습니다<br>
                    • 마커를 클릭하면 상세 정보가 표시됩니다
                </div>
            `;
        }


        function displayMarkersOnMap(dentists) {
            clearMarkers();

            dentists.forEach((dentist, index) => {
                // 좌표 변환 (네이버 API 응답 좌표를 실제 좌표로 변환)
                const lng = dentist.mapx / 10000000;
                const lat = dentist.mapy / 10000000;

                if (lng && lat) {
                    // 마커 생성
                    const marker = new naver.maps.Marker({
                        position: new naver.maps.LatLng(lat, lng),
                        map: map,
                        title: dentist.name,
                        icon: {
                            content: `
                                <div style="
                                    background: #007bff; 
                                    color: white; 
                                    padding: 5px 8px; 
                                    border-radius: 15px; 
                                    font-size: 12px; 
                                    font-weight: bold;
                                    border: 2px solid white;
                                    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
                                ">${index + 1}</div>
                            `,
                            size: new naver.maps.Size(30, 30),
                            anchor: new naver.maps.Point(15, 15)
                        }
                    });

                    // 정보창 생성
                    const infoWindow = new naver.maps.InfoWindow({
                        content: `
                            <div class="info-window">
                                <h4>${dentist.name}</h4>
                                <p>📍 ${dentist.address}</p>
                                <p>🛣️ ${dentist.roadAddress || '도로명 주소 없음'}</p>
                                <p>📞 ${dentist.telephone || '전화번호 없음'}</p>
                                <p>🏷️ ${dentist.category}</p>
                                <hr style="margin: 8px 0;">
                                <p style="color: #007bff; cursor: pointer;" 
                                   onclick="openNaverMap(${lat}, ${lng}, \`${dentist.name}\`)">
                                   🗺️ 네이버지도에서 보기
                                </p>
                            </div>
                        `,
                        borderWidth: 1,
                        borderColor: '#ccc',
                        backgroundColor: '#fff'
                    });

                    // 마커 클릭 이벤트
                    naver.maps.Event.addListener(marker, 'click', function () {
                        // 다른 정보창 닫기
                        infoWindows.forEach(iw => iw.close());

                        // 현재 정보창 열기
                        infoWindow.open(map, marker);

                        // 해당 카드 하이라이트
                        document.querySelectorAll('.dentist-card').forEach(card => {
                            card.classList.remove('selected');
                        });
                        document.querySelector(`[data-index="${index}"]`).classList.add('selected');
                    });

                    markers.push(marker);
                    infoWindows.push(infoWindow);
                }
            });

            // 모든 마커가 보이도록 지도 범위 조정
            if (markers.length > 0) {
                const bounds = new naver.maps.LatLngBounds();
                markers.forEach(marker => {
                    bounds.extend(marker.getPosition());
                });
                map.fitBounds(bounds, { padding: 50 });
            }
        }

        function clearMarkers() {
            markers.forEach(marker => {
                if (marker.setMap) {
                    marker.setMap(null); // 마커 제거
                } else if (marker.getMap) {
                    marker.setMap(null); // Circle 객체 제거
                }
            });

            infoWindows.forEach(infoWindow => {
                if (infoWindow.close) {
                    infoWindow.close(); // 정보창 닫기
                }
            });

            markers = [];
            infoWindows = [];
        }


        function focusMarker(index) {
            if (markers[index]) {
                // 해당 마커로 지도 중심 이동
                map.setCenter(markers[index].getPosition());
                map.setZoom(16);

                // 정보창 열기
                infoWindows.forEach(iw => iw.close());
                infoWindows[index].open(map, markers[index]);

                // 카드 하이라이트
                document.querySelectorAll('.dentist-card').forEach(card => {
                    card.classList.remove('selected');
                });
                document.querySelector(`[data-index="${index}"]`).classList.add('selected');
            }
        }

        function showAllMarkers() {
            if (markers.length > 0) {
                const bounds = new naver.maps.LatLngBounds();
                markers.forEach(marker => {
                    bounds.extend(marker.getPosition());
                });
                map.fitBounds(bounds, { padding: 50 });
            }
        }

        function showMyLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function (position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const myLocation = new naver.maps.LatLng(lat, lng);

                    map.setCenter(myLocation);
                    map.setZoom(15);

                    // 내 위치 마커 표시
                    new naver.maps.Marker({
                        position: myLocation,
                        map: map,
                        icon: {
                            content: '📍',
                            size: new naver.maps.Size(30, 30),
                            anchor: new naver.maps.Point(15, 15)
                        },
                        title: '내 위치'
                    });
                }, function () {
                    alert('위치 정보를 가져올 수 없습니다.');
                });
            } else {
                alert('이 브라우저는 위치 서비스를 지원하지 않습니다.');
            }
        }

        // 네이버 지도에서 보기 함수
        function openNaverMap(lat, lng, name) {
            const naverMapUrl = `https://map.naver.com/v5/search/${encodeURIComponent(name)}/place?c=${lng},${lat},15,0,0,0,dh`;
            window.open(naverMapUrl, '_blank');
        }

        // 전역 변수 추가
        let isCompetitorMode = false;
        let competitorCenter = null;

        // 🔥 업데이트된 주변 치과 검색 함수
        async function searchNearby(lat, lng, currentDentistName, currentAddress) {
            console.log(`🏥 ${currentDentistName} 주변 1km 검색 시작`);
            console.log(`📍 중심 좌표: lat=${lat}, lng=${lng}`);
            console.log(`🏠 주소: ${currentAddress}`);

            // 로딩 상태
            loadingDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            resultsDiv.innerHTML = '';

            try {
                // 주소 정보를 포함해서 API 호출
                const params = new URLSearchParams({
                    lat: lat,
                    lng: lng,
                    radius: 1000,
                    exclude: currentDentistName,
                    address: currentAddress || '' // 주소 정보 추가
                });

                console.log(`🔍 API 호출: /api/search-nearby?${params}`);

                const response = await fetch(`/api/search-nearby?${params}`);
                const data = await response.json();

                console.log('📊 API 응답:', data);

                if (!data.success) {
                    throw new Error(data.error);
                }

                console.log(`✅ 검색어: "${data.searchQuery}"`);
                console.log(`✅ 발견된 경쟁업체: ${data.items.length}개`);

                // 경쟁업체 모드로 전환
                isCompetitorMode = true;
                competitorCenter = {
                    lat: lat,
                    lng: lng,
                    name: currentDentistName,
                    address: currentAddress,
                    searchQuery: data.searchQuery
                };

                // 결과 표시 (개선된 버전)
                displayCompetitorResults(data, currentDentistName);

                // 지도에 마커 표시
                displayCompetitorMarkersOnMap(data.items, lat, lng, currentDentistName);

            } catch (error) {
                console.error('🚨 주변 검색 오류:', error);
                errorDiv.textContent = `주변 치과 검색 중 오류가 발생했습니다: ${error.message}`;
                errorDiv.style.display = 'block';
            } finally {
                loadingDiv.style.display = 'none';
            }
        }


        // 경쟁업체 결과 표시 함수
        function displayCompetitorResults(data, centerDentistName) {
            const competitors = data.items;

            resultsDiv.innerHTML = `
        <div class="competition-info">
            <div class="competition-title">
                🏁 "${centerDentistName}" 주변 1km 경쟁분석
            </div>
            <p><strong>발견된 경쟁업체:</strong> ${data.total}개</p>
            <p><strong>분석 반경:</strong> 1km</p>
            <button onclick="backToOriginalSearch()" style="background: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px;">
                ◀ 원래 검색으로 돌아가기
            </button>
        </div>
        
        ${competitors.length === 0 ?
                    '<div style="text-align: center; padding: 30px; color: #666;">🎉 반경 1km 내에 경쟁업체가 없습니다!</div>' :
                    `<h3 style="margin: 20px 0;">📍 경쟁업체 목록 (거리순)</h3>
            ${competitors.map((competitor, index) => `
                <div class="dentist-card competitor-card" data-index="${index}" onclick="focusCompetitorMarker(${index})">
                    <div class="dentist-header">
                        <div class="dentist-name">${index + 1}. ${competitor.name}</div>
                        <div class="distance-badge">${competitor.distanceText}</div>
                    </div>
                    <div class="dentist-info">📍 주소: ${competitor.address}</div>
                    <div class="dentist-info">🛣️ 도로명: ${competitor.roadAddress || '도로명 주소 없음'}</div>
                    <div class="dentist-info">📞 전화: ${competitor.telephone}</div>
                    <div class="dentist-info">🏷️ 분류: ${competitor.category}</div>
                </div>
            `).join('')}
            
            <div style="margin-top: 20px; padding: 15px; background: #d1ecf1; border-radius: 8px;">
                💡 <strong>경쟁 분석:</strong><br>
                • 경쟁 밀도: ${competitors.length >= 10 ? '🔴 매우 높음' : competitors.length >= 5 ? '🟡 보통' : '🟢 낮음'}<br>
                • 가장 가까운 경쟁업체: ${competitors[0] ? competitors[0].distanceText : 'N/A'}<br>
                • 평균 거리: ${competitors.length > 0 ? Math.round(competitors.reduce((sum, c) => sum + c.distance, 0) / competitors.length) + 'm' : 'N/A'}
            </div>`
                }
    `;
        }

        // 경쟁업체 지도 마커 표시 (수정된 버전)
        function displayCompetitorMarkersOnMap(competitors, centerLat, centerLng, centerName) {
            clearMarkers();

            // 중심 치과 마커 (빨간색)
            const centerMarker = new naver.maps.Marker({
                position: new naver.maps.LatLng(centerLat, centerLng),
                map: map,
                title: centerName,
                icon: {
                    content: `
                <div style="
                    background: #dc3545; 
                    color: white; 
                    padding: 8px 12px; 
                    border-radius: 20px; 
                    font-size: 13px; 
                    font-weight: bold;
                    border: 3px solid white;
                    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
                ">🏥 ${centerName}</div>
            `,
                    size: new naver.maps.Size(200, 40),
                    anchor: new naver.maps.Point(100, 20)
                }
            });

            // 중심 치과 정보창
            const centerInfoWindow = new naver.maps.InfoWindow({
                content: `
            <div class="info-window">
                <h4>🏥 ${centerName} (중심)</h4>
                <p>이 치과를 기준으로 1km 반경 검색</p>
                <p style="color: #dc3545; font-weight: bold;">주변에 ${competitors.length}개 경쟁업체</p>
            </div>
        `
            });

            naver.maps.Event.addListener(centerMarker, 'click', function () {
                infoWindows.forEach(iw => iw.close());
                centerInfoWindow.open(map, centerMarker);
            });

            markers.push(centerMarker);
            infoWindows.push(centerInfoWindow);

            // 경쟁업체 마커들 (노란색) - 여기서 오류 발생했던 부분 수정
            competitors.forEach((competitor, index) => {
                // ✅ mapx, mapy가 있는지 확인 후 좌표 변환
                if (!competitor.mapx || !competitor.mapy) {
                    console.warn(`${competitor.name}: 좌표 정보 없음`);
                    return; // 좌표가 없으면 건너뛰기
                }

                const lat = competitor.mapy / 10000000;
                const lng = competitor.mapx / 10000000;

                // ✅ 좌표 유효성 검사
                if (!lat || !lng || lat < 30 || lat > 40 || lng < 120 || lng > 130) {
                    console.warn(`${competitor.name}: 잘못된 좌표 lat=${lat}, lng=${lng}`);
                    return;
                }

                const marker = new naver.maps.Marker({
                    position: new naver.maps.LatLng(lat, lng),
                    map: map,
                    title: competitor.name,
                    icon: {
                        content: `
                    <div style="
                        background: #ffc107; 
                        color: #333; 
                        padding: 6px 10px; 
                        border-radius: 15px; 
                        font-size: 12px; 
                        font-weight: bold;
                        border: 2px solid white;
                        box-shadow: 0 2px 5px rgba(0,0,0,0.3);
                    ">${index + 1}</div>
                `,
                        size: new naver.maps.Size(30, 30),
                        anchor: new naver.maps.Point(15, 15)
                    }
                });

                const infoWindow = new naver.maps.InfoWindow({
                    content: `
                <div class="info-window">
                    <h4>${competitor.name}</h4>
                    <p>📍 ${competitor.address}</p>
                    <p>📏 거리: <strong>${competitor.distanceText}</strong></p>
                    <p>📞 ${competitor.telephone}</p>
                    <hr style="margin: 8px 0;">
                    <p style="color: #007bff; cursor: pointer;" 
                       onclick="openNaverMap(${lat}, ${lng}, \`${competitor.name}\`)">
                       🗺️ 네이버지도에서 보기
                    </p >
                </div >
                        `
                });

                naver.maps.Event.addListener(marker, 'click', function () {
                    infoWindows.forEach(iw => iw.close());
                    infoWindow.open(map, marker);

                    // 해당 카드 하이라이트
                    document.querySelectorAll('.dentist-card').forEach(card => {
                        card.classList.remove('selected');
                    });
                    const targetCard = document.querySelector(`[data-index="${index}"]`);
                    if (targetCard) {
                        targetCard.classList.add('selected');
                    }
                });

                markers.push(marker);
                infoWindows.push(infoWindow);
            });

            // 1km 반경 원 그리기
            const circle = new naver.maps.Circle({
                map: map,
                center: new naver.maps.LatLng(centerLat, centerLng),
                radius: 1000,
                fillColor: '#28a745',
                fillOpacity: 0.1,
                strokeColor: '#28a745',
                strokeOpacity: 0.8,
                strokeWeight: 2
            });

            markers.push(circle); // 원도 markers 배열에 추가해서 나중에 제거

            // 지도 범위 조정 - 유효한 마커만 고려
            const bounds = new naver.maps.LatLngBounds();
            bounds.extend(new naver.maps.LatLng(centerLat, centerLng));

            competitors.forEach(competitor => {
                if (competitor.mapx && competitor.mapy) {
                    const lat = competitor.mapy / 10000000;
                    const lng = competitor.mapx / 10000000;
                    if (lat && lng && lat > 30 && lat < 40 && lng > 120 && lng < 130) {
                        bounds.extend(new naver.maps.LatLng(lat, lng));
                    }
                }
            });

            map.fitBounds(bounds, { padding: 50 });
        }


        // 경쟁업체 마커에 포커스
        function focusCompetitorMarker(index) {
            if (markers[index + 1]) { // +1은 중심 마커 때문
                map.setCenter(markers[index + 1].getPosition());
                map.setZoom(16);

                infoWindows.forEach(iw => iw.close());
                infoWindows[index + 1].open(map, markers[index + 1]);

                document.querySelectorAll('.dentist-card').forEach(card => {
                    card.classList.remove('selected');
                });
                document.querySelector(`[data-index="${index}"]`).classList.add('selected');
            }
        }

        // 원래 검색으로 돌아가기
        function backToOriginalSearch() {
            isCompetitorMode = false;
            competitorCenter = null;

            // 마지막 검색 결과로 복원 (전역 변수에 저장된 결과 사용)
            if (currentDentists.length > 0) {
                displayResults(currentDentists, currentDentists.length);
                displayMarkersOnMap(currentDentists);
            }
        }







    </script>
</body>

</html>
